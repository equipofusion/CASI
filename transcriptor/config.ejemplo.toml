# Copiá este archivo como config.toml y ajustá lo que necesites.
# config.toml no se versiona: es la configuración de tu máquina.

# Carpeta que el vigía revisa. Dejá acá las grabaciones.
carpeta_vigilada = "~/Downloads/reuniones"

# Dónde se escriben las transcripciones.
carpeta_salida = "~/Transcripciones"

# Modelo de Whisper. large-v3 es el de mejor español; si tu Mac sufre,
# bajá a "medium" (bastante bueno) o "small" (rápido, más errores).
modelo = "large-v3"

# Idioma del audio. "es" evita que el modelo dude en reuniones con
# términos en inglés. Dejalo en "" para autodetectar.
idioma = "es"

# Cuantización. int8 es la opción sensata en CPU.
computo = "int8"

# Núcleos para la transcripción. 0 = todos.
hilos = 0

# Cada cuánto revisa la carpeta, y cuántos segundos debe quedarse quieto un
# archivo antes de tomarlo (para no agarrarlo a mitad de la copia).
intervalo_segundos = 20
espera_estabilidad_segundos = 10

# Separar por hablante. Requiere HF_TOKEN en el archivo .env.
diarizar = true
dispositivo_diarizacion = "cpu"   # "mps" puede ser más rápido, pero es menos estable

# Si sabés cuántas personas hay, ponelo: mejora bastante el corte.
# 0 = que lo decida el modelo.
min_hablantes = 0
max_hablantes = 0

formatos_salida = ["txt", "srt", "md"]
